<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Gazin URL Shortener</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Masuk ke akun Gazin Anda untuk mulai membuat tautan pendek kustom dan memantau analitik klik secara real-time." />
    <meta name="keywords" content="login gazin, masuk gazin, url shortener login" />
    <meta name="author" content="Gazin" />
    <link rel="canonical" href="https://gazin.fun/app/login.html" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gazin.fun/app/login.html" />
    <meta property="og:title" content="Masuk - Gazin URL Shortener" />
    <meta property="og:description" content="Masuk ke akun Gazin Anda untuk mulai membuat tautan pendek kustom dan memantau analitik klik secara real-time." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Custom API & App Scripts -->
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-full flex flex-col font-sans relative overflow-x-hidden">
    
    <!-- Background Glow -->
    <div class="absolute top-[10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-blue-500/5 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-violet-600/5 blur-[120px] pointer-events-none"></div>

    <!-- Header -->
    <header class="w-full border-b border-slate-900 bg-slate-950/80 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl font-black font-outfit bg-gradient-to-r from-blue-400 via-indigo-400 to-violet-500 bg-clip-text text-transparent">Gazin</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition duration-200">
                &larr; Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-10" x-data="loginForm">
        <div class="max-w-md w-full bg-slate-900/60 border border-slate-800/80 rounded-2xl p-8 backdrop-blur-xl shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold font-outfit text-white mb-2">Masuk ke Akun</h2>
                <p class="text-slate-400 text-sm">Kelola tautan pendek Anda dan lihat analitik lanjutan</p>
            </div>

            <!-- Form -->
            <form @submit.prevent="submit()" class="space-y-5">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Alamat Email</label>
                    <input type="email" id="email" x-model="email" required placeholder="john@example.com"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition duration-200">
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-sm font-medium text-slate-300">Kata Sandi</label>
                        <a href="forgot-password.html" class="text-xs text-blue-400 hover:underline">Lupa Kata Sandi?</a>
                    </div>
                    <input type="password" id="password" x-model="password" required placeholder="••••••••"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition duration-200">
                </div>

                <!-- General Error Display -->
                <div class="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl flex items-center gap-2.5 text-xs text-rose-400" x-show="errorMsg" x-cloak>
                    <span>⚠️</span>
                    <span x-text="errorMsg"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" :disabled="loading"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-xl shadow-indigo-600/10 hover:shadow-indigo-600/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-950 focus:ring-blue-500 disabled:opacity-50 transition duration-200">
                    <span x-show="!loading">Masuk Sekarang</span>
                    <span x-show="loading" class="flex items-center justify-center gap-2">
                        <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Memproses...
                    </span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-400">
                Belum memiliki akun? 
                <a href="register.html" class="text-blue-400 hover:underline font-semibold transition">Daftar sekarang</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 bg-slate-950 text-center text-xs text-slate-600">
        <p>&copy; 2026 Gazin. Tugas Kuliah Sistem Terdistribusi.</p>
    </footer>
</body>
</html>
